[package]
name = "rustfighter"
version = "0.1.3"
edition = "2021"
description = "Native Rust reimplementation of the Street Fighter II DOS engine (asset pipeline + viewer)"
license = "MIT"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
minifb = { version = "0.29.0", optional = true }

[features]
default = ["window"]
window = ["dep:minifb"]
embedded = []

[[bin]]
name = "rfdump"
path = "src/bin/rfdump.rs"

[[bin]]
name = "rfplay"
path = "src/bin/rfplay.rs"
required-features = ["window"]

[[bin]]
name = "rfight"
path = "src/bin/rfight.rs"
required-features = ["window"]
